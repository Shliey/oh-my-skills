<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:; base-uri 'none'; form-action 'none'">
<title>$title</title>
<style>
$font_css
:root {
  color-scheme: light;
  --paper: #faf7ef;
  --ink: #202c38;
  --muted: #465564;
  --navy: #10243b;
  --line: #d7d1c4;
  font-family: "IBM Plex Sans", "Microsoft YaHei", "PingFang SC", sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--paper); line-height: 1.7; }
a { color: #234a76; }
a:focus-visible, summary:focus-visible, nav:focus-visible { outline: 2px solid #366eaa; outline-offset: 3px; }
.skip { position: absolute; left: 1rem; top: -4rem; z-index: 3; background: white; padding: .5rem; }
.skip:focus { top: .5rem; }
.masthead { background: var(--navy); color: #fffdf5; padding: clamp(1.3rem, 4vw, 3rem) max(1rem, calc((100% - 74rem) / 2)); }
.masthead h1 { margin: 0; line-height: 1.25; font-family: Lora, Georgia, serif; font-size: clamp(1.6rem, 4vw, 2.65rem); overflow-wrap: anywhere; }
.masthead p { margin: .6rem 0 0; }
.wrap { max-width: 76rem; margin-inline: auto; padding-inline: clamp(1rem, 3vw, 2rem); }
.legend { display: flex; flex-wrap: wrap; gap: .4rem .75rem; list-style: none; margin-block: 0; padding-block: .7rem; }
nav { position: sticky; top: 0; z-index: 2; background: var(--paper); border-block: 1px solid var(--line); }
nav .wrap { display: flex; flex-wrap: nowrap; gap: .3rem; overflow-x: auto; padding-block: .38rem; }
nav a { flex: 0 0 auto; padding: .25rem .5rem; max-width: 75vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[id] { scroll-margin-top: 4.5rem; }
main { padding-block: 1.3rem 3rem; }
h2, h3 { line-height: 1.3; overflow-wrap: anywhere; }
.source, .anchor, .metadata { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.status { padding: .6rem .85rem; border-left: 3px solid #917135; background: #f6edd6; }
.row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: clamp(1rem, 3vw, 2rem); align-items: start; padding-block: 1rem; border-top: 1px solid var(--line); }
.row:target { outline: 2px solid #8ca3bc; outline-offset: 3px; }
.original { background: #fffcf5; padding: .75rem 1rem; font-family: Lora, Georgia, "Songti SC", serif; line-height: 1.8; }
.translation { background: #f0ece2; border-top: 1px solid var(--line); border-left: 2px solid #b7a98d; padding: .65rem 1rem; }
.original p, .translation p, .annotation dd, .stage p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.annotation { background: var(--wash, #f1eee7); border-left: 3px solid var(--edge, #8a8479); padding: .65rem .9rem; }
.annotation dl { margin: .4rem 0 0; }
.annotation dt { font-weight: 650; }
.annotation dd:not(:last-child) { margin-bottom: .4rem; }
.label { display: block; font-family: "IBM Plex Sans", "Microsoft YaHei", sans-serif; font-size: .84rem; font-weight: 650; margin-bottom: .2rem; }
.legend li, mark { padding: 0 .2em; border-radius: .17em; color: inherit; background: var(--fill); }
.thesis { --fill: #fae8a2; --edge: #987624; --wash: #fbf3d9; }
.concept { --fill: #f8d5d4; --edge: #a64c50; --wash: #fbebea; }
.evidence { --fill: #d2e6fa; --edge: #477095; --wash: #eaf3fb; }
.rebuttal { --fill: #d1e9d5; --edge: #48815b; --wash: #eaf5ec; }
.method { --fill: #e8daf4; --edge: #795895; --wash: #f2eaf8; }
figure { margin: .7rem 0; }
figure img { display: block; max-width: 100%; height: auto; }
pre { margin: .5rem 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.table-scroll { max-width: 100%; overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: .25rem .5rem; text-align: start; overflow-wrap: anywhere; }
.synthesis { margin-top: 2rem; border-top: 2px solid var(--navy); }
.synthesis dt { font-weight: 650; }
.synthesis dd { margin: 0 0 .6rem; overflow-wrap: anywhere; }
details { padding: .45rem .7rem; border: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 650; }
.stage { padding-block: .6rem; }
.stage + .stage { border-top: 1px solid var(--line); }
.stage p + p { margin-top: .6rem; }
.backlinks { font-size: .87rem; }
@media (max-width: 720px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: .65rem; }
}
@media print {
  nav, .skip { display: none; }
  .masthead { background: none; color: var(--ink); padding-inline: 1rem; }
  .row { break-inside: avoid; }
}
</style>
</head>
<body>
<a class="skip" href="#reading">跳到论文正文</a>
<header class="masthead"><h1>$title</h1>$course</header>
<ul class="legend wrap" aria-label="批注图例">$legend</ul>
<nav aria-label="章节导航"><div class="wrap">$navigation</div></nav>
<main id="reading" class="wrap">
$metadata
$sections
$synthesis
$analysis
</main>
$font_licenses
</body>
</html>
